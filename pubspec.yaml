name: minas_client
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  qr_flutter: ^4.1.0
  google_fonts: ^6.1.0
  flutter_native_splash: ^2.4.0
  flutter_svg: ^2.0.10
  intl: ^0.19.0
  intl_phone_field: ^3.2.0
  flutter_tilt: ^3.2.2
  carousel_slider: ^5.1.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  easy_localization: ^3.0.5
  url_launcher: ^6.2.4
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  path: ^1.8.3
  webview_flutter: ^4.4.2
  photo_view: ^0.14.0
  image: ^4.1.7
  dio: ^5.4.0
  open_file: ^3.3.2
  path_provider: ^2.1.5
  flutter_launcher_icons: ^0.14.4
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/translations/

  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
        - asset: assets/fonts/cairo/Cairo-Bold.ttf